<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>AI 任务监控</title>
<link rel="stylesheet" href="tasks.css">
</head>
<body>
<div id="app">
  <div id="glow"></div>
  <header id="hdr">
    <span class="dot"></span>
    <span class="ttl">AI 任务监控</span>
    <button id="close" title="关闭">✕</button>
  </header>

  <nav id="tabs" class="hidden"></nav>

  <nav id="seg">
    <button data-seg="running" id="seg-run">⚡ 执行中 <b id="seg-run-n">0</b></button>
    <button data-seg="done" id="seg-done">✓ 已完成 <b id="seg-done-n">0</b></button>
  </nav>

  <main id="grid"></main>

  <div id="empty" class="hidden">
    <div class="ring"></div>
    <p class="empty-t">暂无任务</p>
    <p class="empty-d" id="empty-note"></p>
  </div>

  <footer id="foot">
    <span id="port">…</span>
    <span id="clock">--:--</span>
  </footer>
</div>
<script src="tasks.js"></script>
</body>
</html>
